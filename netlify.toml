# Configuração para publicar no Netlify direto do GitHub.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# O service worker precisa sempre da versão mais nova para o app se atualizar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
